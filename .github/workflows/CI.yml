name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned: rustfmt and clippy change what they flag between releases, so a floating toolchain turns a Rust release into a red main with no code change behind it.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      # rustfmt walks the module tree from the crate root and `rsx_modules!` generates that tree at expansion time, so a bare `cargo fmt --check` formats almost nothing and passes. Handing it the list is what makes the check mean something.
      - run: cargo fmt --check -- $(find apps crates -name '*.rs' -not -path '*/target/*' -not -path '*/.telar/*')

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      # There is no compositor on this runner: everything that needs one is behind HOGAR_SHELL_WAYLAND_LIVE or TELAR_LIVE_*.
      - run: cargo test --workspace

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Must match `rust-version` in [workspace.package].
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - run: cargo check --workspace
