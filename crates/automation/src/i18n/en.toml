[expression]
local_has_no_fields = "`${name}` is one value, with no fields to name"
lock_reads_lock_safe = "`${name}` runs a command, and the lock screen reads only sources marked `lock_safe = true`"
reading_has_fields = "`${name}` is a reading with fields — {fields} — so name one, as `${name}.{first}`"
name_an_event = "name an event, as `$event.session_locked`"
local_outside_copy = "`${name}` is read only by the children of a group with `repeat`, one copy per item of its list"
not_an_event = "`{field}` is not an event: `$event.` takes one of {events}"
no_such_field = "`${name}` has no `{field}`: it has {fields}"
reading_has_no_fields = "`${name}` is one reading, with no fields to name"
nothing_called = "nothing is called `${name}`"
goes_too_deep = "`{reference}` goes deeper than a reading's fields: write `$source.field`"
not_set_yet = "nothing is called `{reference}` yet: no source, no module reading and no variable — a variable set later is read from then on"
no_reading_yet = "`{reference}` has no reading yet"
no_copy_drawn = "`{reference}` has no reading: no copy of its group is drawn"
held_until_trusted = "`{reference}` came with a bundle and is held until you trust what it runs"
local_not_drawn = "`{reference}` is read only where a copy of its group is drawn"
reading_not_number = "`{reference}`: `{text}` is not a number"
reading_not_truth = "`{reference}`: `{text}` is not true or false"
no_empty_value = "`{reference}` has no empty value"
no_variable = "there is no variable called `{reference}`"
language_needs_text = "each language needs a text after it"
negative_bytes = "a byte count is never negative"
negative_rate = "a rate is never negative"
not_a_date_pattern = "`{pattern}` is not a date pattern this shell can write"
not_a_moment = "{seconds} is not a moment this shell can write"

[finding]
either = "{first} or {last}"
no_option_to_bind = "there is no option `{path}` to bind"
target = "`{path}` {why}"
gives_no_table = "holds a table, which an expression cannot give"
gives_no_declared = "is a `{declared}`, which an expression cannot give"
accent_takes_colour = "`accent` takes a colour, not {found}"
option_cannot_take = "an option of this kind cannot take {found}"
not_a_number = "`{text}` is not a number"
not_true_or_false = "`{text}` is not true or false"
not_a_colour = "`{text}` is not a colour: write it as `#rrggbb`"
not_a_pattern = "`{pattern}` is not a pattern: {why}"
not_a_parse = "`{spec}` is not a way to read output: it is `text`, `lines`, `json:<path>` or `regex:<pattern>`"
not_json = "the output is not JSON: {why}"
json_nothing_at = "the JSON has nothing at `{path}`"
json_not_a_value = "the JSON at `{path}` is not a text, a number, a bool or a list of them"
no_match = "`{pattern}` matches nothing in the output"
path_unclosed = "`{path}` opens a `[` it does not close"
path_not_a_position = "`[{index}]` in `{path}` is not a position in a list"
path_empty_key = "`{path}` has an empty key in it"
interval_not_a_number = "`{text}` is not an interval: write a whole number and a unit, as `5s`"
interval_unit = "`{text}` is not an interval: its unit is `ms`, `s`, `m` or `h`"
interval_raised = "`{written}` is more often than `[automation] min_interval_seconds` allows, so it runs every {least}"
listen_lines = "a `listen` source reads every line as a reading of its own, so it cannot be read as `lines`"
source_needs = "a `{kind}` source needs `{key}`"
command_empty = "the command is empty"
command_control = "the command has a control character in it (`{character}`)"
url_control = "`{url}` has a control character in it"
url_not_http = "`{url}` is not an `http://` or `https://` address"
initial_lines = "`lines` makes every reading a list, so `initial` has to be one"
initial_mixed = "every item of `initial` has to be of one type"
initial_nested = "`initial` can be a list, but not a list of lists"
initial_kind = "`initial` is a text, a number, `true` or `false`, or a list of one of them"
timed_out = "it did not finish within {limit} and was stopped"
too_long = "it printed more than {run} KiB in one run, or {line} KiB on one line, and was stopped"
line_too_long = "it printed a line longer than the limit and was stopped"
exited = "it exited with {exit}"
not_started = "it could not be started: {why}"
not_waited_on = "it could not be waited on: {why}"
stopped = "it stopped"
no_answer = "`{url}` did not answer within {limit}"
not_fetched = "`{url}` could not be fetched: {why}"
not_read = "`{url}` could not be read: {why}"
source_failed = "`${name}` failed: {why}"
copy_failed = "copy #{copy}: {why}"
rule_failed = "the rule `{id}` did not finish: {why}"
rule_name_taken = "a rule above is called `{id}` already: each rule needs a name of its own"
rule_runs_rule = "`{line}` runs a rule from a rule, which could run itself forever: write the commands here, or give both rules the same trigger"
rule_unknown_command = "`{line}` is not a command this shell has (`hogar-shell --list` names them)"
rule_does_nothing = "the rule runs nothing and stores nothing, so firing it does nothing"
rule_needs_id = "a rule needs an `id`, the name `hogar-shell rule run` takes"
rule_id = "`{id}` is not a rule name: write it with letters, digits, `-` and `_`"
rule_needs_trigger = "a rule needs a trigger: one of {keys}"
rule_one_trigger = "a trigger is one of {keys}, and this one already says `{first}`"
not_an_event = "`{value}` is not an event: it is one of {events}"
store_shows_hidden = "`{written}` is hidden on the lock screen, but `${var}` is not: the lock screen can read a variable, so keeping it there shows it to anyone"
schedule_time = "`{word}` is not a time of day: write it as `HH:MM`, as `07:30`"
schedule_word = "`{word}` is neither a time nor days: days are `mon` … `sun`, a range such as `mon-fri`, `weekdays` or `weekends`"
schedule_needs_time = "a schedule needs a time of day, as `07:30`"
when_unreadable = "its `when` could not be read: {why}"
store_unreadable = "its `store` could not be read: {why}"
not_kept = "`{var}` could not be kept: {why}"
ran_itself = "`{id}` ran itself again while it was firing, which would never end, so the inner run was refused"
suspended = "`{id}` fired more than {count} times within a second, which only a loop does — a rule setting itself off, or two setting each other off — so it is suspended until the config is loaded again"
var_type_change = "`{name}` is a {held}, not a {asked}: `var remove {name}` first to change its type"
var_holds = "`{name}` is a {held}: {why}"
list_of_lists = "a variable cannot hold a list of lists"
not_a_type = "`{name}` is not a type: it is `text`, `number`, `bool`, `colour`, `image`, `font` or `list:<type>`"
var_value_type = "{value} is not a {held}, which is what the variable holds"
var_name = "`{name}` cannot be read as `${name}`: a variable's name is letters, digits and `_`, and does not start with a digit"
var_not_finite = "{value} is not a number a variable can hold"
var_list_items = "every item of a list has to be of the list's type"
