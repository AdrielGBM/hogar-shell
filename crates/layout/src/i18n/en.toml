unknown_komponent = "there is no komponent `{komponent}` to draw (`{file}` is missing or could not be read), so a placeholder stands in for it"
unknown_parameter = "the komponent `{komponent}` has no parameter `{name}`; it has {declared}"
parameters_without_komponent = "this group draws no komponent, so it has no parameters to set"
komponent_exists = "a komponent called `{komponent}` exists already; choose another name"
use_unknown_komponent = "there is no komponent called `{komponent}` (`{file}` is missing or could not be read); `komponent list` names the ones there are"
use_parameter = "the expression for the parameter `{name}` is wrong"
use_lock = "the lock layer holds readings, never controls, and the komponent `{komponent}` holds more than that"
use_occupied = "the group `{area}.{group}` holds modules of its own, which the komponent would replace: use a group of its own, or take its modules out first"
use_drawing = "the group `{area}.{group}` draws the komponent `{komponent}` already: detach it first, or use a group of its own"
use_no_groups = "`{area}` is a `{kind}` area, which holds no komponents"
use_no_screen = "`{area}` is a grid, and which of its cells are free depends on the screen that draws it, which there is none of"
use_zone_off_bar = "`{area}` is a `{kind}` area, which has no zones: only a bar places a group in a zone"
use_zone_of_existing = "the group `{area}.{group}` exists and keeps its place: a zone is named only for a new group"
detach_not_here = "the group `{group}` does not draw a komponent at the level being edited, so there is nothing to detach there"
shared_komponent_address = "two groups called `{address}` on different layers both draw a komponent, so their children would share ids: rename one of the areas or groups"
komponent_mark = "`{mark}` is kept for the children a komponent draws (`bar-top.end{mark}clock`), so an id cannot contain it"
parameter_name = "`{name}` cannot be read as `${name}`: a parameter's name is letters, digits and `_`, and does not start with a digit"
parameter_local = "`${name}` is what a copy of a repeated group reads, so a parameter cannot be called `{name}`"
parameter_shadows = "a module already gives a reading called `{name}`, which a parameter of that name would hide inside the komponent"
shared_child_id = "two children of this komponent share an id"
komponent_lock_expression = "on the lock layer, `{what}` of the komponent `{komponent}`: {why}"
komponent_lock_action = "the lock layer holds readings, never controls, and `{child}` of the komponent `{komponent}` has actions"
komponent_lock_interactive = "the lock layer holds readings, never controls, and `{child}` of the komponent `{komponent}` draws `{module}` as `{representation}`, which can be interacted with"
trust_pending = "{what} came with the bundle `{bundle}` and does not run until you trust it: `hogar-shell layout trust {bundle} {id}`"
trust_declined = "{what} came with the bundle `{bundle}` and was declined, so it does not run; `hogar-shell layout trust {bundle} {id}` accepts it"
trust_in_action = "`{line}` would trust a bundle from an action, and trust is yours to give: run it yourself"
trust_in_action_written = "`{line}` would trust a bundle from the action at `{key}`, and trust is yours to give: run `layout trust` yourself rather than binding it to a gesture"
trust_contested = "more than one bundle says it wrote `{file}` ({bundles}), so nothing it runs is trusted; machine state should never say this — remove the file, or the bundles' records of it in state.json"
trust_carried = "{what} came with the bundle `{bundle}` and is not trusted, so an edit cannot copy it into `{file}`, which is yours and would run it: trust it first (`hogar-shell layout trust {bundle} {id}`), or leave it out of what you copy"
bundle_built_in = "`{id}` is the built-in layout, which every installation has already; export a layout of your own"
bundle_asset_missing = "`{path}` is not a file, so it cannot be carried in the bundle"
bundle_exists = "`{path}` exists and is not empty; a bundle is written to a directory of its own"
bundle_no_manifest = "`{path}` has no manifest.toml, so it is not a bundle"
bundle_name = "`{name}` cannot name a bundle: use lowercase letters a–z, digits, `-` and `_`, which no other script can imitate"
bundle_built_in_name = "a bundle cannot carry a layout called `{id}`: that is the built-in layout's name"
bundle_file_name = "`{name}` cannot name a layout or a komponent: use lowercase letters a–z, digits, `-` and `_`"
bundle_empty = "the bundle holds no layout"
bundle_asset_name = "`{name}` cannot be one of a bundle's pictures: each is a plain file directly under `assets/`"
bundle_asset_path = "`{path}` is not a picture this bundle carries: a bundle names its pictures as `assets/<file>`"
bundle_link = "`{path}` is a symbolic link, and a bundle carries plain files only: a link would carry whatever it points at"
bundle_not_plain = "`{path}` is not a plain file, and a bundle carries plain files only"
bundle_too_large = "`{path}` holds more than {limit} bytes, more than a bundle may carry there"
bundle_too_many = "`{path}` holds more than {limit} entries, more than a bundle may carry there"
bundle_not_text = "`{path}` is not UTF-8 text"
bundle_bidi = "`{text}` holds U+{code}, which changes the direction text is shown in: a command, an address or an action has no use for it, and with it what you are shown is not what runs"
unreadable_display_name = "`{name}` holds U+{code}, a control character or one that changes the direction text is shown in, which a name has no use for"
unreadable_name = "`{name}` holds U+{code}, which hides, reorders or rewrites what is around it: an id, a name or a key is something you read and type, so it holds only characters that show as themselves"
template_unknown = "there is no template called `{name}`; the shell ships {known}"
template_taken = "a layout called `{name}` exists already: give the new one another name"

