[finding]
source_name = "`{name}` cannot be read as `${name}`: a source's name is letters, digits and `_`, and does not start with a digit"
source_shadows = "a module already gives a reading called `{name}`, so `${name}` could not say which one it meant"
source_missing = "a `{kind}` source needs `{key}`, and no layout in this chain gives it one"
no_prompt = "the lock layer has no prompt, so there would be nothing to type a password into"
prompts = "the lock layer has {count} prompts, and only the one holding keyboard focus would work"
prompt_visible = "the prompt cannot be given a visibility expression: an expression that turns false locks the user out"
prompt_off_output = "the prompt does not lie on the output, so it could not be reached"
prompt_too_small = "the prompt is too small to type into"
prompt_faint = "the prompt is drawn at {opacity}, too faint to find; it stays at {least} or above"
prompt_contrast = "the prompt's text is {ratio}:1 against this card, under the {needed}:1 it needs to be read (WCAG AA)"
prompt_covered = "`{id}` is stacked over the prompt, which would cover it"
unknown_key = "`{key}` is not a key of {holder}"
gradient_stops = "a gradient is drawn from at most {most} stops and this one has {count}, so the last {extra} would never appear"
bar_radius = "a bar is rounded by its `shape.radius`, so this one is not drawn"
shared_area_id = "two areas on this layer share an id, so a rule cannot say which it means"
shared_group_id = "two groups in this area share an id"
copy_mark = "`{mark}` is kept for the copies a repeated group draws (`{example}`), so an id cannot contain it"
shared_instance_id = "this instance id is already used elsewhere in the layout, and IPC addresses instances by id"
unknown_module = "there is no module called `{module}`"
no_representation = "`{module}` cannot be drawn as `{representation}`"
option = "`{module}`: `{key}` {why}"
unknown_command = "`{line}` is not a command this shell has"
repeat_needs_list = "expected a list to repeat the group's children over, but this gives {found}"
cell_repeats = "a grid cell covers the cells it was placed at and no more, so its children cannot be repeated: repeat them in a zone"
hidden_reserve = "this area reserves its edge, and keeps it reserved while its expression hides it, so windows stay clear of an empty strip"
unset_on_area = "an area takes back `visible` and nothing else, so `{unset}` takes nothing back"
unset_on_group = "a group takes back `repeat` and nothing else, so `{unset}` takes nothing back"
unset_on_instance = "an instance takes back a binding, written `bindings.<path>`, so `{unset}` takes nothing back"
unset_no_binding = "`{module}` has no binding `{path}` to take back: {why}"
unset_and_written = "this level writes `{unset}` and takes it back as well: keep the key to give it an expression here, or the `unset` to take back the one it inherits"
unset_nothing = "nothing under this level writes `{unset}` here, so there is nothing to unset"
lock_action = "the lock layer holds readings, never controls, so an action here is refused"
lock_interactive = "`{module}` as `{representation}` can be interacted with, and the lock layer takes readings only"
workspace_removes_reserving = "`{id}` reserves space, and a workspace rule that removed it would re-tile every window on each workspace switch"
workspace_reserve = "a workspace rule cannot change what an area reserves: reservation is decided per output, so that switching workspaces never re-tiles windows"
workspace_reserving_kind = "`{id}` reserves space, so a workspace rule may change what is inside it but not its geometry"
extends_itself = "`{id}` extends itself through this chain, so it was not applied"
unknown_layout = "there is no layout called `{id}`"
workspace_number = "`{value}` is not a workspace number, so this rule never applies"
workspace_id_needs_hyprland = "matching a workspace by number needs Hyprland, which is not running, so this rule is inactive"
workspace_special_needs_hyprland = "matching a special workspace needs Hyprland, which is not running, so this rule is inactive"
area_needs = "a `{kind}` area needs `{field}`, and nothing set it, so this area was left out"
area_no_id = "an area has no `id`, so nothing can address it and it was left out"
area_no_kind = "this area never says what kind it is, so it was left out"
paint_holds_nothing = "a `{kind}` area is paint and holds nothing, so its groups were left out"
group_no_id = "a group has no `id`, so nothing can address it and it was left out"
group_no_place = "this group never says where it sits, so it was left out"
instance_no_id = "an instance has no `id`, so nothing can address it and it was left out"
instance_no_module = "this instance never says which module it shows, so it was left out"
no_output_rule = "there is no output rule matching `{pattern}`"
no_workspace_rule = "the output rule `{output}` has no workspace rule matching `{workspace}`"
no_lock_layer = "the workspace rule `{workspace}` has no lock layer: no workspace is visible while the screen is locked"
rule_exists = "there is already a rule at `{at}`"
no_area = "there is no area called `{id}`"
no_group = "there is no group called `{id}`"
no_instance = "there is no instance called `{id}`"
out_of_range = "position {index} is past the {listed} there are"
prompt_removed = "`{id}` is the lock screen's password prompt, which can be moved and restyled but never removed"
prompt_kind = "`{id}` is the lock screen's password prompt, which can be moved and restyled but never turned into another kind of area"
prompt_hidden = "`{id}` is the lock screen's password prompt, which can be moved and restyled but never given a visibility expression: one that turned false would lock the user out"
reservation = "a workspace rule cannot add, remove or resize `{id}` or change what it reserves: reservation is decided per output, so that switching workspaces never re-tiles windows"
built_in_read_only = "`{id}` is the built-in layout and cannot be edited; copy it first"
nothing_to_undo = "there is nothing to undo"
nothing_to_redo = "there is nothing to redo"
safe_layout = "this shell was started with --safe-layout, which draws the built-in layout and writes none; restart it without the flag to edit"
nothing_to_take_back = "nothing gives {held} on {screens}, so there is nothing to take back"
nowhere_to_take_back = "no rule of this layout speaks for {screens}, so there is nowhere to take back {held}"
taken_back_elsewhere = "{held} is given by `{rule}` of `{file}`, which the narrowest rule of this layout for {screens}, `outputs.{narrowest}`, is not laid over, so an `unset` there cannot take it back: delete it in `{rule}` instead"
every_output = "every output"

[finding.holder]
area = "an area"
group = "a group"
source = "a source"
area_of_kind = "a `{kind}` area"
group_of_kind = "a `{kind}` group"
source_of_kind = "a `{kind}` source"

[finding.listed]
areas = "{len} areas"
groups = "{len} groups"
instances = "{len} instances"
output_rules = "{len} output rules"
workspace_rules = "{len} workspace rules"

[finding.held]
visible = "`visible` of `{area}`"
repeat = "`repeat` of `{area}.{group}`"
binding = "`bindings.{path}` of `{instance}`"
