[package]
name = "hogar-shell"
description = "A Wayland desktop shell in Rust — bars, panels, launcher, dashboard, lock screen, notifications, capture and dynamic theming, configured in TOML."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true

[lib]

[[bin]]
name = "hogar-shell"
path = "src/main.rs"

[dependencies]
telar = { workspace = true, features = [
    "async-assets",
    "preview-headless",
] }
platform-wayland = { workspace = true }
config = { workspace = true }
layout = { workspace = true }
services = { workspace = true }
ui = { workspace = true }
surfaces = { workspace = true }
modules = { workspace = true }
settings = { workspace = true }
util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2.5"
toml.workspace = true
libc.workspace = true
